name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run checks
        run: composer check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Generate coverage
        run: mkdir -p coverage && XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover coverage/clover.xml

      - name: Check coverage file
        run: |
          ls -lah coverage
          test -s coverage/clover.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: php-n8n/client
          fail_ci_if_error: true
