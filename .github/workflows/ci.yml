name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run checks
        run: composer check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Generate coverage
        run: mkdir -p coverage && XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover coverage/clover.xml

      - name: Check coverage file
        run: |
          ls -lah coverage
          test -s coverage/clover.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: php-n8n/client
          fail_ci_if_error: true

  dispatch-post-ci:
    name: Dispatch post-CI build
    runs-on: ubuntu-latest
    needs:
      - check
      - coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Dispatch post-CI build workflow
        uses: saedyousef/repository-dispatch@v0.2
        with:
          token: ${{ secrets.REPOSITORY_DISPATCH_TOKEN }}
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          event_type: client-ci-passed
          client_payload: '{"sha":"${{ github.sha }}","ref":"${{ github.ref_name }}","run_id":"${{ github.run_id }}","run_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
