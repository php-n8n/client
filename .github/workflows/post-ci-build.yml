name: Post-CI Build

on:
  repository_dispatch:
    types:
      - client-ci-passed

permissions:
  contents: read

jobs:
  build:
    name: Build Composer archive
    runs-on: ubuntu-latest

    env:
      # Pass the dispatch payload through env, never interpolate it into scripts.
      DISPATCH_SHA: ${{ github.event.client_payload.sha }}

    steps:
      - name: Validate dispatched commit SHA
        run: |
          if [[ ! "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid commit SHA in dispatch payload"
            exit 1
          fi

      - name: Checkout dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DISPATCH_SHA }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate package metadata
        run: composer validate --strict

      - name: Build Composer archive
        run: |
          mkdir -p dist
          composer archive --format=zip --file="dist/php-n8n-client-${DISPATCH_SHA}"

      - name: Upload package archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-n8n-client-${{ env.DISPATCH_SHA }}
          path: dist/*.zip
          if-no-files-found: error
